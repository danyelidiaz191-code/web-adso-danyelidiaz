<!DOCTYPE html>
<html lang="es">

    <div class="col-4"><div class="p-3 bg-warning-subtle rounded">col-4</div></div>
  </div>
</main>
<div class="row g-3">
  <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-info-subtle rounded">A</div></div>
  <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-info-subtle rounded">B</div></div>

<!-- Tarjeta -->
<article class="card h-100">
  <div class="card-body">
    <h3 class="h5 card-title">🐝 100 % natural <span class="badge text-bg-success">Nuevo</span></h3>
    <p class="card-text">Sin azúcar ni aditivos.</p>
  </div>
</article>

<form class="row g-3">

    <input type="text" class="form-control" id="nombre" name="nombre" required>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Enviar</button>
  </div>
</form>
