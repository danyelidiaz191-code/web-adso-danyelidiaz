
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones SENA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Formulario de Inscripciones SENA</h1>

        <form action="#" id="formInscripcion" method="post">

            <fieldset>
                <legend>Datos personales</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre"
                           minlength="3" required>
                    <small id="error-nombre" class="error"></small>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" name="documento"
                           inputmode="numeric"
                           pattern="[0-9]{6,10}"
                           minlength="6" maxlength="10"
                           title="El documento debe contener entre 6 y 10 dígitos numéricos."
                           required>
                    <small id="error-documento" class="error"></small>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                    <small id="error-correo" class="error"></small>
                </div>

                <div class="campo">
                    <label for="telefono">Celular</label>
                    <input type="tel" id="telefono" name="telefono"
                           inputmode="numeric"
                           pattern="3[0-9]{9}"
                           title="El celular debe tener 10 dígitos y comenzar por 3."
                           required>
                    <small id="error-telefono" class="error"></small>
                </div>
            </fieldset>

            <fieldset>
                <legend>Curso</legend>

                <div class="campo">
                    <label for="programa">Programa de formación</label>
                    <select id="programa" name="programa" required>
                        <option value="">Elige una opción</option>
                        <option value="adso">ADSO</option>
                        <option value="sistemas">Sistemas</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="ganaderia">Ganadería</option>
                        <option value="automotriz">Automotriz</option>
                    </select>
                    <small id="error-programa" class="error"></small>
                </div>

                <fieldset class="grupo">
                    <legend>Jornada</legend>

                    <label for="manana">
                        <input type="radio" name="jornada" id="manana"
                               value="Mañana" required>
                        Mañana
                    </label>

                    <label for="tarde">
                        <input type="radio" name="jornada" id="tarde"
                               value="Tarde">
                        Tarde
                    </label>

                    <label for="nocturna">
                        <input type="radio" name="jornada" id="nocturna"
                               value="Nocturna">
                        Nocturna
                    </label>

                    <small id="error-jornada" class="error"></small>
                </fieldset>

                <div class="campo">
                    <label for="terminos">
                        <input type="checkbox" id="terminos"
                               name="terminos" required>
                        Autorizo el tratamiento de mis datos personales.
                    </label>
                    <small id="error-terminos" class="error"></small>
                </div>
            </fieldset>

            <button type="submit" class="boton">Registrarme</button>
        </form>

        <section id="resumen"></section>
    </main>

  
    <script src="js/app.js"></script>
</body>
</html>
